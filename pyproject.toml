[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "ecfem"
version         = "1.0.0"
description     = "Elastic Curve-based FEM for exact analysis of non-prismatic frame members"
readme          = "README.md"
license         = { file = "LICENSE" }
authors         = [
    { name = "Muslum Kilinc" },
    { name = "Mustafa Al-Anbagi" },
]
keywords        = ["finite element", "structural engineering", "non-prismatic", "tapered beam", "FEM"]
classifiers     = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies    = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
]

[project.optional-dependencies]
examples = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
    "pytest-cov",
]

[project.urls]
"Homepage"    = "https://github.com/<your-username>/ec-fem"
"Paper"       = "https://doi.org/<your-doi>"
"Bug Tracker" = "https://github.com/<your-username>/ec-fem/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecfem*"]
